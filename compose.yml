name: qicore-site

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
