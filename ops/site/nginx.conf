server {
    listen 3007;
    listen [::]:3007;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        return 503;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
